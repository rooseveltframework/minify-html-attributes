on: [push, pull_request]
name: CI
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # show all CI failures rather than stopping CI on first failure
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci

      # the integration tests build and serve the express sample app, which has its own dependency tree
      - name: Install sample app dependencies
        run: npm ci
        working-directory: sampleApps/express

      # and drive it in a real browser, which playwright has to download first
      - name: Install the browser the integration tests drive
        run: npx playwright install chromium
        if: runner.os != 'Linux'
      - name: Install the browser the integration tests drive, and its system libraries
        run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run lint
      - run: npm run coverage
